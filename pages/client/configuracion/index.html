<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configuracion</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <!-- SlideBar para buscar otras opciones -->
    <div class="offcanvas offcanvas-start" id="nav"></div>

    <div id="main" class="bg-light">
      <div>
        <button class="btn" data-bs-toggle="offcanvas" data-bs-target="#nav">
          <img
            src="/src/assets/MenuBar.svg"
            style="width: 40px; height: 40px"
            viewBox="0 0 16 16"
          />
        </button>
      </div>
      <div class="m-3 bg-white border rounded-3 p-3">
        <h3>Informacion Personal</h3>
        <div class="my-4">
          <p class="fw-bold m-0">Usuario Anonimo</p>
          <p class="text-secondary">Miembro desde 2026</p>
        </div>
        <div>
          <form id="formModificarUsuario">
            <div>
              <label for="formModificarUsuarioNombre" class="form-label">Nombre</label>
              <input
                type="text"
                name="formModificarUsuarioNombre"
                id="formModificarUsuarioNombre"
                class="form-control"
              />
            </div>
            <div>
              <label for="formModificarUsuarioApp" class="form-label">Apellido Paterno</label>
              <input
                type="text"
                name="formModificarUsuarioApp"
                id="formModificarUsuarioApp"
                class="form-control"
              />
            </div>
            <div>
              <label for="formModificarUsuarioApm" class="form-label">Apellido Materno</label>
              <input
                type="text"
                name="formModificarUsuarioApm"
                id="formModificarUsuarioApm"
                class="form-control"
              />
            </div>
            <div>
              <label for="formModificarUsuarioCorreo" class="form-label"
                >Correo Electronico</label
              >
              <input
                type="email"
                name="formModificarUsuarioCorreo"
                id="formModificarUsuarioCorreo"
                class="form-control"
                disabled
              />
            </div>
            <div>
              <label for="formModificarUsuarioTelefono" class="form-label">Telefono</label>
              <input
                type="tel"
                name="formModificarUsuarioTelefono"
                id="formModificarUsuarioTelefono"
                class="form-control"
                disabled
              />
            </div>
            <div class="mt-4 d-flex">
              <button id="btn-modificar" class="btn btn-primary d-flex">Modificar</button>
            </div>
          </form>
        </div>
      </div>
      <div class="m-3 bg-white border rounded-3 p-3">
        <div class="d-flex">
          <h3>Mis Vehiculos</h3>
          <button
            class="btn btn-danger ms-auto"
            data-bs-toggle="modal"
            data-bs-target="#modalAuto"
          >
            + Agregar Vehiculo
          </button>
        </div>
        <div id="vehiculo"></div>
      </div>
      <div class="m-3 bg-white border rounded-3 p-3">
        <div class="d-flex">
          <h3>Metodos de Pago</h3>
          <button
            class="btn btn-danger ms-auto"
            data-bs-toggle="modal"
            data-bs-target="#modalTarjeta"
          >
            + Agregar Tarjeta
          </button>
        </div>
        <div id="tarjeta"></div>
      </div>
    </div>

    <!-- Modal para agregar Autos -->
    <div class="fade modal" id="modalAuto">
      <div class="modal-dialog">
        <div class="modal-content">
          <!-- Modal Header -->
          <div class="modal-header">
            <h4 class="modal-title">Agregar Auto</h4>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <form id="formAgregarAuto">
            <!-- Modal body -->
            <div class="modal-body">
              <label for="formAgregarAutoMarca" class="form-label"
                >Seleccione la marca de vehiculo</label
              >
              <select
                name="formAgregarAutoMarca"
                id="formAgregarAutoMarca"
                class="form-select"
              ></select>
              <label for="formAgregarAutoModelo" class="form-label"
                >Seleccione el modelo de su Auto</label
              >
              <select
                name="formAgregarAutoModelo"
                id="formAgregarAutoModelo"
                class="form-select"
              ></select>
              <label for="formAgregarAutoColor" class="form-label"
                >Seleccione el color de su Auto</label
              >
              <select
                name="formAgregarAutoColor"
                id="formAgregarAutoColor"
                class="form-select"
              >
                <option value="Azul">Azul</option>
                <option value="Beige">Beige</option>
                <option value="Blanco">Blanco</option>
                <option value="Gris">Gris</option>
                <option value="Negro">Negro</option>
                <option value="Plata">Plata</option>
                <option value="Rojo">Rojo</option>
                <option value="Verder">Verde</option>
              </select>
              <label for="formAgregarAutoMatricula" class="form-label"
                >Matricula del auto</label
              >
              <input
                type="text"
                name="formAgregarAutoMatricula"
                id="formAgregarAutoMatricula"
                class="form-control"
              />
            </div>

            <!-- Modal footer -->
            <div class="modal-footer">
              <input
                type="submit"
                value="+ Agregar vehiculo"
                class="btn btn-success fw-bold"
              />
              <button type="button" class="btn btn-danger" data-bs-dismiss="modal">
                Close
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <!-- Modal para agregar tarjetas -->
    <div class="fade modal" id="modalTarjeta">
      <div class="modal-dialog">
        <div class="modal-content">
          <!-- Modal Header -->
          <div class="modal-header">
            <h4 class="modal-title">Agregar nueva tarjeta</h4>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <form id="formAgregarTarjeta">
            <!-- Modal body -->
            <div class="modal-body">
              <label for="formAgregarTarjetaNombre" class="form-label"
                >Nombre del titular</label
              >
              <input
                type="text"
                name="formAgregarTarjetaNombre"
                id="formAgregarTarjetaNombre"
                class="form-control"
              />
              <label for="formAgregarTarjetaNumero" class="form-label"
                >Numero de la tarjeta</label
              >
              <input
                type="text"
                name="formAgregarTarjetaNumero"
                id="formAgregarTarjetaNumero"
                class="form-control"
              />
              <label for="formAgregarTarjetaMes" class="form-label">Mes de Vencimiento</label>
              <input
                type="text"
                name="formAgregarTarjetaMes"
                id="formAgregarTarjetaMes"
                class="form-control"
              />
              <label for="formAgregarTarjetaAnio" class="form-label">Año de Vencimiento</label>
              <input
                type="text"
                name="formAgregarTarjetaAnio"
                id="formAgregarTarjetaAnio"
                class="form-control"
              />
              <label for="formAgregarTarjetaCVV" class="form-label">CVV</label>
              <input
                type="text"
                name="formAgregarTarjetaCVV"
                id="formAgregarTarjetaCVV"
                class="form-control"
              />
            </div>

            <!-- Modal footer -->
            <div class="modal-footer">
              <input type="submit" value="+ Agregar Tarjeta" class="btn btn-success fw-bold" />
              <button type="button" class="btn btn-danger" data-bs-dismiss="modal">
                Close
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script type="module" src="/src/slidebarClient.js"></script>
    <script type="module" src="script.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
